        - xtls-rprx-vision
        - xtls-rprx-vision-udp443
        description: Available connection flow modes.
        member_descriptions:
          NONE: No flow mode.
          XTLS_RPRX_VISION: Provides flow control and `TLS` masquerading for `TCP`
            traffic to mitigate active probing and fingerprinting by censors.
          XTLS_RPRX_VISION_UDP443: Optimizes flow control and masquerading specifically
            for `UDP` port `443` to prevent side-channel analysis of `HTTP/3` and
            `QUIC` connections.
