        - none
        description: Header obfuscation applied to the `TCP` transport.
        member_descriptions:
          HTTP: Disguise traffic with a fake `HTTP` header.
          NONE: No header obfuscation.
    - proxy_configs_transport_options_mode:
        name: XHTTPMode
        members:
        - AUTO
        - PACKET_UP
        - STREAM_UP
        - STREAM_ONE
        values:
        - auto
        - packet-up
        - stream-up
        - stream-one
        description: Data transmission mode of the `XHTTP` transport.
        member_descriptions:
          AUTO: Automatically select the transmission mode.
          PACKET_UP: Send uplink data as discrete packets.
          STREAM_UP: Send uplink data as a continuous stream.
          STREAM_ONE: Send both uplink and downlink over a single stream.
    - response_rules_encryption_method:
        name: EncryptionMethodType
        members:
        - AGE1
        - AGE1PQ1
        values:
        - age1
        - age1pq1
        description: Encryption method for response modification.
        member_descriptions:
          AGE1: '`age` X25519 encryption.'
          AGE1PQ1: '`age` post-quantum encryption.'
    - api_token_endpoint_kind:
        name: APITokenScope
        members:
        - READ
        - WRITE
        values:
        - read
        - write
        description: Available API token permission scopes.
        member_descriptions:
          READ: Read-only access.
          WRITE: Read and write access.
    - mihomo_ip_version:
        name: MihomoIPVersion
        members:
        - DUAL
        - IPV4
        - IPV6
        - IPV4_PREFER
        - IPV6_PREFER
        values:
        - dual
        - ipv4
        - ipv6
        - ipv4-prefer
        - ipv6-prefer
        description: Mihomo IP version preference.
        member_descriptions:
          DUAL: Use both `IPv4` and `IPv6`.
          IPV4: Use `IPv4` only.
          IPV6: Use `IPv6` only.
          IPV4_PREFER: Prefer `IPv4`, falling back to `IPv6`.
          IPV6_PREFER: Prefer `IPv6`, falling back to `IPv4`.
