        - SHADOWSOCKS
        - HYSTERIA
        values:
        - vless
        - trojan
        - shadowsocks
        - hysteria
        description: Proxy protocol used by the connection.
        member_descriptions:
          VLESS: Lightweight stateless protocol without built-in encryption, typically
            paired with `TLS` or `REALITY`.
          TROJAN: Protocol that disguises traffic as regular `HTTPS` to evade detection.
          SHADOWSOCKS: Encrypted `SOCKS5` proxy protocol.
          HYSTERIA: '`QUIC`-based protocol optimized for lossy, high-latency networks.'
